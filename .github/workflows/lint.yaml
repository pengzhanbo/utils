name: Lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: pnpm ci

      - name: Lint
        run: pnpm run lint:action
