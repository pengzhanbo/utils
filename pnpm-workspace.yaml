shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - cached-factory
  - ts-api-utils

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver

allowBuilds:
  esbuild: true
  simple-git-hooks: true

minimumReleaseAgeExclude:
  - '@pengzhanbo/oxc-config@ 2.8.1'
  - '@pengzhanbo/tsconfig@2.8.1'
